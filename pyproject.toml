[build-system]
requires = ["scikit-build-core>=0.3.3", "pybind11; python_version < '3.14'", "pybind11>=3.0.1; python_version >= '3.14'", "setuptools_scm[toml]>=8.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build-dir = ".skbuild/{wheel_tag}"
logging.level = "INFO"
install.strip = false
sdist.include = ["cpp/**", "extern/eigen/**", "extern/spectra/**"]
sdist.exclude = [
    "tests",
    "docs",
    ".git*",
    "developments",
]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"

[project]
name = "SuPyMode"
version = "2.4.7"
description = "A package for light propagation in fiber optics."
license = {file = "LICENSE"}
readme = "README.rst"
requires-python = ">=3.11"
authors = [{ name="Martin Poinsinet de Sivry-Houle", email="martin.poinsinet.de.sivry@gmail.com"}]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "setuptools_scm[toml]>=8.0",
    "numpy>=2.0.0",
    "MPSPlots",
    "pydantic",
    "PyFinitDiff",
    "FiberFusing",
    "pyvista",
    "PyFiberModes<0.17",
    "pathvalidate",
]
keywords = [
    "coupled-mode theory",
    "waveguide",
]

[project.urls]
Homepage = "https://github.com/MartinPdeS/SuPyMode"
Repository = "https://github.com/MartinPdeS/SuPyMode"
Issues = "https://github.com/MartinPdeS/SuPyMode/issues"
Documentation = "https://martinpdes.github.io/SuPyMode/"

[project.optional-dependencies]
testing = [
    "pytest>=0.6",
    "pytest-cov>=2.0",
    "pytest-json-report==1.5.0",
    "coverage==7.16.2",
]
documentation = [
    "MartinPdeS-docs>=0.2.1,<0.3",
    "PyFiberModes",
    "PyOptik",
]
dev = [
    "ruff>=0.8,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.coverage.run]
source = ["SuPyMode"]
omit = [
    "*\\__init__.py",
    "SuPyMode/_version.py",
    "SuPyMode/directories.py",
    "SuPyMode/tools/special.py",
    "SuPyMode/tools/utils.py",
    "SuPyMode/special.py",
]
branch = true
relative_files = true

[tool.cibuildwheel]
build-frontend = "build"
test-extras = ["testing"]
environment = { PIP_ONLY_BINARY=":all:", PIP_PREFER_BINARY="1", MPLBACKEND="Agg" }

[tool.cibuildwheel.linux]
archs = ["x86_64"]
build = ["cp311-manylinux*", "cp312-manylinux*", "cp313-manylinux*", "cp314-manylinux*"]
manylinux-x86_64-image = "manylinux_2_28"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
test-command = "cd /tmp && python -m pytest --import-mode=importlib --config-file={project}/pytest.ini {project}/tests --ignore={project}/tests/extra/test_system_plot.py --ignore={project}/tests/single/representation.py"

[tool.cibuildwheel.macos]
archs = ["arm64"]
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*"]
repair-wheel-command = "delocate-wheel -w {dest_dir} -v {wheel}"
test-command = "cd /tmp && python -m pytest --import-mode=importlib --config-file={project}/pytest.ini {project}/tests"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*"]
test-command = "cd /d %TEMP% && python -m pytest --import-mode=importlib --config-file={project}/pytest.ini {project}/tests"
