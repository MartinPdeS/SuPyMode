package:
  name: supymode
  version: 2.4.1

source:
  path: ..

build:
  number: 0
  script:
    - export CXXFLAGS="${CXXFLAGS} -D_LIBCPP_DISABLE_AVAILABILITY"  # [osx]
    # conda-build exports a stale Visual Studio generator on the Windows runner.
    # CMake 4 no longer recognises it; clearing the variable lets CMake select
    # the installed Visual Studio toolchain.
    - set "CMAKE_GENERATOR="  # [win]
    - "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"

requirements:
  build:
    - {{ compiler('cxx') }}
    - llvm-openmp  # [osx]
    - cmake >=3.20
  host:
    - python {{ PY_VER }}*
    - python_abi 3.13.* *_cp313   # [py==313]
    - python_abi 3.14.* *_cp314   # [py==314]
    - scikit-build-core ~=0.3
    - pybind11 ~=2.13  # [py<314]
    - pybind11 >=3.0.1,<4  # [py>=314]
    - python-build ~=1.2
    - setuptools_scm[toml] ~=8.0
    - numpy >=2.0,<3  # [py<314]
    - numpy >=2.3.3,<3  # [py>=314]
  run:
    - martinpdes::pyoptik
    - martinpdes::mpsplots
    - martinpdes::fiberfusing
    - martinpdes::pyfibermodes
    - martinpdes::pyfinitdiff
    - numpy >=2.0,<3  # [py<314]
    - numpy >=2.3.3,<3  # [py>=314]
    - pyvista
    - scipy
    - pydantic
    - tabulate
    - pathvalidate

about:
  home: https://github.com/MartinPdeS/SuPyMode
  license: MIT
  summary: "A package for light propagation in fiber optics component."
  description: SuPyMode is a library that uses Finite-difference and coupled mode theory to simulate light propagation in fiber optics tapered components.
  dev_url: https://github.com/MartinPdeS/SuPyMode
  doc_url: https://martinpdes.github.io/SuPyMode/
  license_file: LICENSE
  keywords:
    - optics
    - fiber optics
    - coupled mode theory
    - finite difference
    - physics
    - computational optics
    - simulation

files:
  include:
    - "SuPyMode/binary/*.so"

test:
  imports:
    - SuPyMode
  requires:
    - python {{ PY_VER }}*
    - python_abi 3.13.* *_cp313   # [py==313]
    - python_abi 3.14.* *_cp314   # [py==314]
    - pytest >=0.6
    - pytest-cov >=2.0
    - pytest-json-report ==1.5
    - coverage ==7.6
  commands:
    - python -m pytest
  source_files:
    - tests

extra:
  recipe-maintainers:
    - MartinPdeS
