name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    uses: MartinPdeS/MPSActions/.github/workflows/run_tests.yml@v7
    with:
      python-versions: '["3.11", "3.14"]'
      submodules: 'true'
      install-command: >-
        python -m pip install --upgrade pip && python -m pip install -e ".[testing]"
      test-command: python -m pytest -q
