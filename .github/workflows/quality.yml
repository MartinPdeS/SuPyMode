name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    uses: MartinPdeS/MPSActions/.github/workflows/run_quality.yml@v12
    with:
      python-versions: '["3.11", "3.12"]'
      install-command: python -m pip install "ruff>=0.6,<1"
      quality-command: python -m ruff check SuPyMode tests
